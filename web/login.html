<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · RadiologyOS</title><link rel="stylesheet" href="style.css"><style>body{margin:0}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1b2b,#173b51)}.loginbox{width:390px;max-width:90vw;background:white;border-radius:14px;padding:38px;box-shadow:0 25px 80px #0004}.loginbrand{text-align:center;font-size:25px;font-weight:700;margin-bottom:30px}.loginbrand span{color:#17a3a0}.loginbox h1{font-size:21px;text-align:center;margin:0 0 7px}.loginbox p{text-align:center;color:#71808e;margin:0 0 24px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:12px;color:#71808e;font-weight:600}.field input{border:1px solid #e4eaf0;padding:11px;border-radius:6px;font:inherit}.primary{background:#4378f4;color:white;padding:13px 16px;border-radius:7px;font-weight:600;width:100%;margin-top:12px;font:inherit;cursor:pointer;border:0}.loginhint{text-align:center;font-size:11px;color:#71808e;margin-top:17px}</style></head><body><div class="login"><form class="loginbox" onsubmit="event.preventDefault();location.href='/app'"><div class="loginbrand">Radiology<span>OS</span></div><h1>Welcome back</h1><p>Sign in to your reporting workspace</p><div class="field"><label>Email address</label><input value="doctor@stmarys.example" type="email"></div><div class="field"><label>Password</label><input value="demo" type="password"></div><button class="primary">Sign in to RadiologyOS</button><div class="loginhint">Demo access · doctor@stmarys.example</div></form></div></body></html>
