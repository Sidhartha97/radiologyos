="818" width="830" height="92" rx="14" fill="#fff" stroke="#d3dfeb"/><text x="535" y="853" font-size="16" font-weight="700" fill="#2b4157">Network controls</text><text x="535" y="878" font-size="14" fill="#5b7185">ALB SG allows configured test /32 · app SG trusts ALB · RDS SG trusts app only</text></g>
