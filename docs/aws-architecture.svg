<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">RadiologyOS AWS architecture</title><desc id="desc">GitHub Actions deploys immutable ARM64 Docker images through ECR to an EC2 Auto Scaling Group behind an Application Load Balancer in a dedicated VPC. The private application tier uses Cognito, private PostgreSQL, S3, DynamoDB, Bedrock Knowledge Bases, S3 Vectors, Bedrock Runtime and Secrets Manager. KMS encrypts data.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#62748a"/></marker><marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2878c8"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#24835b"/></marker><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#132c45" flood-opacity=".12"/></filter></defs>
<rect width="1600" height="1050" fill="#f3f7fb"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#122b45">RadiologyOS · AWS deployment architecture</text><text x="50" y="82" font-family="Arial,sans-serif" font-size="15" fill="#526a80">Tenant-isolated reporting · filtered RAG · container CI/CD · development target</text>
