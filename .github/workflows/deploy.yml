name: CI and EC2 deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radiologyos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-and-deploy:
    name: Build ARM image and deploy to EC2
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      DOCKERHUB_PULL_SECRET_ARN: ${{ vars.DOCKERHUB_PULL_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: radiologyos-github-deploy
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable ARM64 image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            --tag "${DOCKERHUB_IMAGE}:${IMAGE_TAG}" \
            --push .
      - name: Deploy image through Systems Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${DOCKERHUB_IMAGE}:${IMAGE_TAG}"
          export IMAGE_URI AWS_REGION DOCKERHUB_PULL_SECRET_ARN
          python3 - <<'PY'
          import json, os, shlex
          image = os.environ["IMAGE_URI"]
          region = os.environ["AWS_REGION"]
          pull_secret = os.environ["DOCKERHUB_PULL_SECRET_ARN"]
          commands = [f"""set -eu
          OLD_IMAGE=$(cat /opt/radiologyos/image.txt 2>/dev/null || true)
          DOCKERHUB_SECRET=$(aws secretsmanager get-secret-value --region {shlex.quote(region)} --secret-id {shlex.quote(pull_secret)} --query SecretString --output text)
          DOCKERHUB_USERNAME=$(printf '%s' "$DOCKERHUB_SECRET" | python3 -c 'import json,sys; print(json.load(sys.stdin)["username"])')
          printf '%s' "$DOCKERHUB_SECRET" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"], end="")' | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          unset DOCKERHUB_SECRET DOCKERHUB_USERNAME
          docker pull {shlex.quote(image)}
          docker logout
          printf '%s\\n' {shlex.quote(image)} > /opt/radiologyos/image.txt
          systemctl restart radiologyos.service
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          if [ -n \"$OLD_IMAGE\" ]; then
            printf '%s\\n' \"$OLD_IMAGE\" > /opt/radiologyos/image.txt
            systemctl restart radiologyos.service
          fi
          echo 'New deployment did not become healthy; previous image restored when available.' >&2
          exit 1"""]
          with open("ssm-parameters.json", "w", encoding="utf-8") as output:
              json.dump({"commands": commands}, output)
          PY
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' --output text)"
          echo "SSM deployment command: $COMMAND_ID"
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) echo "EC2 deployment healthy."; exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Details:StatusDetails,Output:StandardErrorContent}' --output json
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for EC2 deployment; inspect SSM command $COMMAND_ID."
          exit 1
